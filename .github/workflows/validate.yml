name: OneRack Pro checks
on:
  push:
    branches: [main, 'reconcile/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      DIRECT_URL: postgresql://validation:validation@127.0.0.1:1/validation
      ONERACK_AI_ENABLED: 'false'
      OPENAI_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck -- --incremental false
      - run: npm run build -- --webpack
      - name: Prepare commit-addressed source snapshot
        run: python3 scripts/source_snapshot.py --output "$RUNNER_TEMP/onerack-pro-source"
